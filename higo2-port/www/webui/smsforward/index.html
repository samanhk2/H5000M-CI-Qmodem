<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>短信转发</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1f1f1f;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1180px;margin:auto}.title{font-size:22px;font-weight:600;margin-bottom:18px}.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 8px #0000000d}.settings-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.settings-pane{min-width:0;padding:0 22px}.settings-pane:first-child{padding-left:0}.settings-pane:last-child{padding-right:0;border-left:1px solid #e8e8e8}.card h3{margin:0 0 18px;font-size:16px}.row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:12px;margin:13px 0}.row input,.row select{width:100%;height:36px;border:1px solid #d9d9d9;border-radius:6px;padding:0 10px;background:#fff;color:#1f1f1f}.row input::placeholder{color:#bfbfbf!important;opacity:1}.toggle-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px}.toggle-row>label:first-child{white-space:nowrap;min-width:0}.toggle-wrap{position:relative;display:inline-flex;flex:0 0 44px;width:44px;height:22px;cursor:pointer}.toggle-wrap input{position:absolute;width:1px;height:1px;opacity:0}.toggle-track{position:absolute;inset:0;border-radius:11px;background:#bfbfbf;transition:.2s}.toggle-track:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:.2s}.toggle-wrap input:checked+.toggle-track{background:#1890ff}.toggle-wrap input:checked+.toggle-track:after{transform:translateX(22px)}.toggle-wrap input:focus-visible+.toggle-track{outline:2px solid #91caff;outline-offset:2px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}button{border:0;border-radius:6px;padding:9px 18px;cursor:pointer}button.primary{background:#1677ff;color:#fff}.history{margin-top:16px}.item{padding:12px 0;border-bottom:1px solid #eee;overflow-wrap:anywhere}.meta{color:#777;font-size:15px;line-height:1.6;margin:0}.ok{color:#52c41a}.bad{color:#ff4d4f}@media(max-width:760px){body{padding:10px}.settings-columns{grid-template-columns:1fr}.settings-pane{padding:0}.settings-pane:last-child{margin-top:20px;padding-top:20px;border-left:0;border-top:1px solid #e8e8e8}.row:not(.toggle-row){grid-template-columns:1fr;gap:5px}}
</style></head><body><div class="wrap"><div class="title">短信转发</div><div class="card"><div class="settings-columns"><div class="settings-pane"><h3>转发设置</h3>
<div class="row toggle-row"><label for="enabled">启用转发</label><label class="toggle-wrap"><input id="enabled" type="checkbox" role="switch"><span class="toggle-track"></span></label></div>
<div class="row"><label>推送方式</label><select id="push_type"><option value="pushplus">PushPlus</option><option value="wxpusher">WxPusher</option><option value="pushdeer">PushDeer</option><option value="wxwork">企业微信</option><option value="bark">Bark</option><option value="dingtalk">钉钉</option><option value="feishu">飞书</option><option value="iyuu">IYUU</option><option value="telegram">Telegram</option><option value="serverchan">Server酱</option></select></div>
<div class="row"><label>通知标题</label><input id="sms_title" value="" placeholder="通知标题"></div><div class="row toggle-row"><label for="delete_after_forward">成功后删除模组短信</label><label class="toggle-wrap"><input id="delete_after_forward" type="checkbox" role="switch"><span class="toggle-track"></span></label></div>
</div><div class="settings-pane"><h3>推送凭据</h3><div id="credentials"></div><div class="actions"><button id="test">测试推送</button><button class="primary" id="save">保存及应用</button></div><div id="result"></div></div></div></div>
<div class="card history"><h3>最近转发记录</h3><div id="history">暂无记录</div></div></div>
<script>
const fields={pushplus:[['pushplus_token','推送令牌']],wxpusher:[['wxpusher_token','应用令牌'],['wxpusher_topicids','主题编号']],pushdeer:[['pushdeer_key','推送密钥']],wxwork:[['wxwork_webhook','机器人地址']],bark:[['bark_url','推送地址']],dingtalk:[['dingtalk_token','访问令牌']],feishu:[['feishu_webhook','机器人地址']],iyuu:[['iyuu_token','推送令牌']],telegram:[['telegram_bot_token','机器人令牌'],['telegram_chat_id','会话编号']],serverchan:[['serverchan_sendkey','发送密钥']]};
let secrets={};function renderFields(){let box=document.getElementById('credentials');box.innerHTML='';(fields[push_type.value]||[]).forEach(([id,label])=>{let row=document.createElement('div');row.className='row';row.innerHTML=`<label>${label}</label><input id="${id}" type="password" placeholder="留空表示保持原值">`;box.appendChild(row)})}push_type.onchange=renderFields;
async function jsonRequest(url,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try {const response=await fetch(url,{...options,signal:controller.signal});let data;try{data=await response.json()}catch(_){throw Error('服务返回异常，请稍后重试')}
 if(!response.ok)throw Error(data.error||'请求失败，请稍后重试');return data;
 }catch(error){if(error.name==='AbortError')throw Error('请求超时，请检查连接后重试');if(error instanceof TypeError)throw Error('连接失败，请检查网络后重试');throw error}finally{clearTimeout(timer)}
}
function showError(error){result.textContent=error.message||'请求失败，请检查连接后重试'}
function formSettings(){let data={enabled:enabled.checked?'1':'0',push_type:push_type.value,sms_title:sms_title.value,delete_after_forward:delete_after_forward.checked?'1':'0'};
 (fields[push_type.value]||[]).forEach(([id])=>{let v=document.getElementById(id).value;if(v)data[id]=v});return data}
async function load(){let d=await jsonRequest((location.pathname.startsWith('/sms-forward/')?'/sms-forward':'')+'/api/status'),c=d.config||{},savedTitle=String(c.sms_title??''),historyBox=document.getElementById('history');enabled.checked=c.enabled!=='0';push_type.value=c.push_type||'pushplus';sms_title.value=savedTitle;delete_after_forward.checked=c.delete_after_forward!=='0';renderFields();historyBox.innerHTML=(d.history||[]).map(x=>`<div class="item"><div class="meta">${x.timestamp||'-'} · ${x.sender||'-'} · <span class="${x.forwarded?'ok':'bad'}">${x.forwarded?'已转发':'失败'}</span></div></div>`).join('')||'暂无记录'}
save.onclick=async()=>{save.disabled=true;try{await jsonRequest((location.pathname.startsWith('/sms-forward/')?'/sms-forward':'')+'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formSettings())});result.textContent='保存成功';try{await load()}catch(error){result.textContent='保存成功，但重新读取失败，请刷新页面'}}catch(error){showError(error)}finally{save.disabled=false}};
test.onclick=async()=>{test.disabled=true;result.textContent='正在测试…';try{let d=await jsonRequest((location.pathname.startsWith('/sms-forward/')?'/sms-forward':'')+'/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formSettings())});result.textContent=d.ok?(d.message||'测试消息已提交，等待渠道投递'):(d.error||'测试推送失败')}catch(error){showError(error)}finally{test.disabled=false}};
save.disabled=true;test.disabled=true;load().then(()=>{save.disabled=false;test.disabled=false}).catch(showError);
</script><script>
(function(){
 if(window.parent===window)return;
 var scheduled=false,last=0;
 // HTTP embedding uses the WebUI port, HTTPS embedding shares its origin.
 var target=location.protocol==='https:'?location.origin:location.protocol+'//'+location.hostname+':8001';
 function update(){if(scheduled)return;scheduled=true;requestAnimationFrame(function(){scheduled=false;var wrap=document.querySelector('.wrap');var style=getComputedStyle(document.body);var height=Math.ceil((wrap?wrap.getBoundingClientRect().bottom:document.body.getBoundingClientRect().bottom)+parseFloat(style.paddingBottom||0));if(height!==last){last=height;parent.postMessage({type:'modem-sms-height',height:height},target);}});}
 new ResizeObserver(update).observe(document.body);window.addEventListener('resize',update);update();
})();
</script></body></html>
